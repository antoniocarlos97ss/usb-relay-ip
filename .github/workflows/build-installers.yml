name: Build Installers

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - "fix/**"
      - "feature/**"
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: build-installers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-client.txt
            requirements-host.txt

      - name: Install NSIS
        run: choco install nsis -y --no-progress
        shell: powershell

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller -r requirements-client.txt -r requirements-host.txt

      - name: Build installers
        run: bash build/build_installers.sh

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: usb-relay-installers-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
