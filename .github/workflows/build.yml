name: Build USB Relay IP

on:
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-host.txt -r requirements-client.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  build:
    name: Build Installers
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-host.txt -r requirements-client.txt pyinstaller

      - name: Download USB drivers
        run: |
          mkdir usbipd-install
          curl -L -o usbipd-install/usbipd-win_5.3.0_x64.msi "https://github.com/dorssel/usbipd-win/releases/download/v5.3.0/usbipd-win_5.3.0_x64.msi"
          curl -L -o usbipd-install/USBip-0.9.7.7-x64.exe "https://github.com/vadimgrn/usbip-win2/releases/download/v.0.9.7.7/USBip-0.9.7.7-x64.exe"

      - name: Build Host (PyInstaller)
        shell: cmd
        run: >
          python -m PyInstaller --noconsole --onedir --uac-admin --name USBRelayHost
          --add-data "host/assets/icon.ico;assets"
          --add-data "usbipd-install/usbipd-win_5.3.0_x64.msi;usbipd-install"
          --hidden-import fastapi --hidden-import uvicorn --hidden-import pydantic --hidden-import PyQt6
          host/main.py

      - name: Build Client (PyInstaller)
        shell: cmd
        run: >
          python -m PyInstaller --noconsole --onedir --name USBRelayClient
          --add-data "client/assets/icon.ico;assets"
          --add-data "usbipd-install/USBip-0.9.7.7-x64.exe;usbipd-install"
          --hidden-import httpx --hidden-import pydantic --hidden-import PyQt6
          client/main.py

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build Host Installer (NSIS)
        shell: cmd
        run: '"C:\Program Files (x86)\NSIS\makensis.exe" build/installer_host.nsi'

      - name: Build Client Installer (NSIS)
        shell: cmd
        run: '"C:\Program Files (x86)\NSIS\makensis.exe" build/installer_client.nsi'

      - name: Upload Host Installer
        uses: actions/upload-artifact@v4
        with:
          name: USBRelayHost_Setup
          path: dist/USBRelayHost_Setup.exe

      - name: Upload Client Installer
        uses: actions/upload-artifact@v4
        with:
          name: USBRelayClient_Setup
          path: dist/USBRelayClient_Setup.exe
